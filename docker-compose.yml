version: '3.9'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: medcds-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: medcds
    networks:
      - medcds-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/medcds --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: medcds-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - medcds-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medcds-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/medcds
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d
      INFERMEDICA_APP_ID: ${INFERMEDICA_APP_ID}
      INFERMEDICA_APP_KEY: ${INFERMEDICA_APP_KEY}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DRUGBANK_API_KEY: ${DRUGBANK_API_KEY}
      PDF_OUTPUT_DIR: /app/reports
    volumes:
      - reports_data:/app/reports
      - logs_data:/app/logs
    networks:
      - medcds-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (built React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medcds-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - medcds-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: medcds-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - reports_data:/var/www/reports:ro
    networks:
      - medcds-network

volumes:
  mongodb_data:
  redis_data:
  reports_data:
  logs_data:

networks:
  medcds-network:
    driver: bridge
