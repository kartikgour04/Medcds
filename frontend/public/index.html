<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="MedCDS - AI-Powered Clinical Decision Support System. Evidence-based health assessments with drug safety filters." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:title" content="MedCDS - Clinical Decision Support" />
    <meta property="og:description" content="AI-powered health assessments with WHO, NICE, ICMR clinical guidelines and multi-layer drug safety filters." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>MedCDS — Clinical Decision Support System</title>

    <style>
      /* Prevent flash of unstyled content */
      body {
        margin: 0;
        background-color: #020617;
        color: #f1f5f9;
        font-family: 'Outfit', system-ui, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading spinner shown before React mounts */
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
      }
      #initial-loader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #1e293b;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #initial-loader p {
        color: #64748b;
        font-size: 14px;
        margin: 0;
      }
      #initial-loader .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      #initial-loader .logo-icon {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #2563eb, #16a34a);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      #initial-loader .logo-text {
        font-size: 20px;
        font-weight: 700;
        color: #f1f5f9;
        font-family: 'Sora', sans-serif;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align:center;padding:40px;color:#f1f5f9;background:#020617;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div>
          <h2>JavaScript Required</h2>
          <p>MedCDS requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
        </div>
      </div>
    </noscript>

    <div id="root">
      <!-- Initial loader shown before React mounts -->
      <div id="initial-loader">
        <div class="logo">
          <div class="logo-icon">⚕️</div>
          <span class="logo-text">MedCDS</span>
        </div>
        <div class="spinner"></div>
        <p>Loading Clinical Decision Support System…</p>
      </div>
    </div>
  </body>
</html>
